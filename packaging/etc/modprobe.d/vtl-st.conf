# Disable st direct I/O for VTL virtual tape devices.
# Direct I/O bypasses SCSI READ/WRITE handlers and reads
# stale sparse-file data instead of the compressed data stream.
# This causes "Device offlined - not ready after error recovery"
# on Kylin 4.19 and other kernels with st driver.
options st try_direct_io=0 try_rdio=0 try_wdio=0 buffer_kbs=32
